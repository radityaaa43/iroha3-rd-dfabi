name: s5-test
# End-to-end test of the S5 pipeline with the REAL tools of the pinned images: keygen x4, mint-finality roster, assemble-s5.sh,
# render-peer.sh x4, iroha3d --check-config, then 4 stock nodes from the signed genesis commit blocks. Throwaway keys,
# no secrets, no cluster. scripts/test-s5.sh is the single source (it also runs on a laptop with docker).
on:
  pull_request:
    paths: ['network/**', 'scripts/test-s5.sh', '.github/workflows/s5-test.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_IMAGE: ghcr.io/radityaaa43/iroha3-rd-node:071e281e-stark
  DRIVER_IMAGE: ghcr.io/radityaaa43/iroha3-rd-driver:33d5ffac
jobs:
  s5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        epoch: ['3600', '1152921504606846976'] # strings: YAML would turn the big number into a float
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "pull the pinned images"
        run: |
          docker pull -q "$NODE_IMAGE" >/dev/null
          docker pull -q "$DRIVER_IMAGE" >/dev/null
      - name: "scripts/test-s5.sh (RUN_CHAIN=1)"
        run: EPOCH_LENGTH=${{ matrix.epoch }} RUN_CHAIN=1 CHAIN_WAIT=120 bash scripts/test-s5.sh
