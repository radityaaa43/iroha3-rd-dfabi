name: genesis-probe
# Diagnostic, not a gate: runs the REAL kagami of the public node image on a hosted runner with THROWAWAY keys to settle
# the [unverified] points of network/assemble.sh (base genesis flags, --topology shape, source of the KAGEMUSHA
# mint-finality public parameters) before S5. No secrets, no cluster, no repo key material. Read the step logs.
on:
  pull_request:
    paths: ['network/**', '.github/workflows/genesis-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/radityaaa43/iroha3-rd-node:071e281e-stark
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "kagami help texts (flags, topology, mint-finality)"
        run: |
          docker pull -q "$IMAGE" >/dev/null
          k() { docker run --rm --entrypoint kagami "$IMAGE" "$@"; }
          for c in "--help" "keys --help" "genesis --help" "genesis generate --help" "genesis sign --help" "genesis materialize --help" "kagemusha --help" "localnet --help"; do
            echo "::group::kagami $c"; k $c 2>&1 || echo "rc=$?"; echo "::endgroup::"
          done
      - name: "throwaway keys (4 x BLS + PoP, 1 x genesis ed25519), sizes and public parts only"
        run: |
          mkdir -p "$RUNNER_TEMP/k"
          k() { docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/k:/work/out" --entrypoint kagami "$IMAGE" "$@"; }
          for v in a b c d; do k keys --algorithm bls_normal --pop --out-dir "/work/out/v$v" >/dev/null; done
          k keys --algorithm ed25519 --out-dir /work/out/genesis >/dev/null
          for v in a b c d; do echo "v$v: public.key $(wc -c < "$RUNNER_TEMP/k/v$v/public.key") bytes, pop.hex $(wc -c < "$RUNNER_TEMP/k/v$v/pop.hex") bytes"; done
          echo "genesis public key: $(cat "$RUNNER_TEMP/k/genesis/public.key")"
          ls -l "$RUNNER_TEMP/k/va" | awk '{print $1, $9}'
      - name: "genesis generate without the mint-finality parameters (what does it demand?)"
        run: |
          set +e
          pub=$(cat "$RUNNER_TEMP/k/genesis/public.key")
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/k:/work/out" --entrypoint kagami "$IMAGE" genesis generate \
            --profile iroha3-dev --ivm-dir /work/out/ivm --genesis-public-key "$pub" \
            --kagemusha-mint-finality-parameters /work/out/none.json --consensus-mode npos default 2>&1 | head -20
          echo "rc=${PIPESTATUS[0]}"
      - name: "does the image carry the ivm libraries a generate needs?"
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c 'find / -maxdepth 4 \( -name "ivm_libs" -o -name "*.to" \) -not -path "/proc/*" 2>/dev/null | head -5' 2>&1 || echo "no sh in the image: rc=$?"
      - name: "localnet genesis vs genesis generate default: instruction shape (throwaway, public data only)"
        run: |
          set +e
          ln="$RUNNER_TEMP/ln"; mkdir -p "$ln" "$RUNNER_TEMP/gd"
          docker run --rm --user "$(id -u):$(id -g)" -v "$ln:/work/out" --entrypoint kagami "$IMAGE" localnet \
            --peers 4 --consensus-mode npos --chain-id 00000000-0000-4000-8000-000000000000 --out-dir /work/out >/dev/null 2>&1
          echo "localnet rc=$?"
          # the public mint-finality parameter file localnet wrote (it is a public roster, no seed)
          pf=$(grep -rl '"epoch_roster"' "$ln" 2>/dev/null | head -3); echo "files holding epoch_roster:"; echo "$pf"
          pf1=$(echo "$pf" | head -1)
          shape() { jq -c '{tx: (.transactions|length), kinds: ([.transactions[].instructions[]? | if type=="object" then keys[0] else "norito" end] | group_by(.) | map({(.[0]): length}) | add), topology: [.transactions[].topology|length], params: (.transactions[0].parameters // {} | keys), custom: ([.transactions[].parameters.custom // {} | keys[]] | sort)}' "$1"; }
          echo "--- localnet genesis.json shape"; shape "$ln/genesis.json"
          if [ -n "$pf1" ]; then
            cp "$pf1" "$RUNNER_TEMP/gd/params.json"
            pub=$(cat "$RUNNER_TEMP/k/genesis/public.key")
            for ivm in "." "/work/out/ivm"; do
              echo "--- genesis generate default --ivm-dir $ivm"
              docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP/gd:/work/out" --entrypoint kagami "$IMAGE" genesis generate \
                --profile iroha3-dev --ivm-dir "$ivm" --genesis-public-key "$pub" \
                --kagemusha-mint-finality-parameters /work/out/params.json --consensus-mode npos default > "$RUNNER_TEMP/gd/g.json" 2> "$RUNNER_TEMP/gd/err.txt"
              echo "rc=$?"; head -5 "$RUNNER_TEMP/gd/err.txt"
              [ -s "$RUNNER_TEMP/gd/g.json" ] && shape "$RUNNER_TEMP/gd/g.json" && break
            done
            echo "--- ivm_dir / libs in generated manifest"; jq -c '{ivm_dir: .ivm_dir, chain: .chain, consensus_mode: .consensus_mode}' "$RUNNER_TEMP/gd/g.json" 2>&1 | head -3
            echo "--- has CanSetParameters grant / XOR asset def / lane-0 validators (generate default)"
            jq -c '{canSetParams: ([.transactions[].instructions[]? | objects | select(.Grant.Permission.object.name=="CanSetParameters")]|length), xor: ([.transactions[].instructions[]? | objects | select(.Register.AssetDefinition.name=="XOR")]|length), lane0: ([.transactions[].instructions[]? | objects | select(has("RegisterPublicLaneValidator"))]|length)}' "$RUNNER_TEMP/gd/g.json" 2>&1 | head -3
          fi
