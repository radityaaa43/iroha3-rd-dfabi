name: build-image
on:
  workflow_dispatch:
  push:
    paths: ['build/**']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COMMIT: 071e281e778c5928cab4d6e007b7ddc9b050df27
      IMAGE: ghcr.io/radityaaa43/iroha3-rd-node:071e281e-stark
    steps:
      - uses: actions/checkout@v4
      - name: Free disk and add swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          # swap on /mnt (separate disk) to survive linker/rustc memory peaks
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -g
      - name: Fetch Iroha source
        run: |
          git init "$RUNNER_TEMP/iroha"
          git -C "$RUNNER_TEMP/iroha" fetch --depth 1 https://github.com/hyperledger-iroha/iroha "$COMMIT"
          git -C "$RUNNER_TEMP/iroha" checkout --detach FETCH_HEAD
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: CARGO_BUILD_JOBS=4 build/build-image.sh "$RUNNER_TEMP/iroha" "$IMAGE"
      - name: Smoke
        run: |
          docker run --rm --entrypoint iroha3d "$IMAGE" --version
          docker run --rm --entrypoint kagami "$IMAGE" --help
      - name: Push
        run: docker push "$IMAGE"
