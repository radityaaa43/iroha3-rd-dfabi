name: build-image
on:
  workflow_dispatch:
  push:
    paths: ['build/**']
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COMMIT: 071e281e778c5928cab4d6e007b7ddc9b050df27
      IMAGE: ghcr.io/radityaaa43/iroha3-rd-node:071e281e-stark
    steps:
      - uses: actions/checkout@v4
      - name: Free disk and add swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          # Best-effort swap: never block the build (/mnt may be missing or small).
          # No layer cache across re-runs by design: the Dockerfile compiles inside
          # RUN --mount=type=cache, which registry cache-to export does not capture,
          # so a re-run restarts the Rust compile (fits within the 340 min job).
          for f in /mnt/swapfile /swapfile; do
            if sudo fallocate -l 8G "$f" && sudo chmod 600 "$f" && sudo mkswap "$f" && sudo swapon "$f"; then
              break
            fi
            sudo rm -f "$f"
            echo "::warning::swap at $f failed, trying next"
          done || true
          df -h /
          free -g
      - name: Fetch Iroha source
        run: |
          git init "$RUNNER_TEMP/iroha"
          git -C "$RUNNER_TEMP/iroha" fetch --depth 1 https://github.com/hyperledger-iroha/iroha "$COMMIT"
          git -C "$RUNNER_TEMP/iroha" checkout --detach FETCH_HEAD
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: CARGO_BUILD_JOBS=4 build/build-image.sh "$RUNNER_TEMP/iroha" "$IMAGE"
      - name: Smoke
        run: |
          docker run --rm --entrypoint iroha3d "$IMAGE" --version
          docker run --rm --entrypoint kagami "$IMAGE" --help
      - name: Push
        run: docker push "$IMAGE"
