name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deploy/k8s/**']
concurrency: deploy
jobs:
  deploy:
    runs-on: [self-hosted, iroha3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get kubectl v1.33.13
        run: |
          base=https://dl.k8s.io/release/v1.33.13/bin/linux/amd64
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo kubectl "$base/kubectl"
          echo "$(curl -fsSL "$base/kubectl.sha256")  kubectl" | sha256sum -c -
          chmod +x kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: scripts/check-manifests.sh
      - name: Preconditions (genesis unchanged, Secrets and ConfigMap present)
        run: |
          want=$(kubectl kustomize deploy/k8s | sed -nE 's/^ +iroha3-rd\/genesis: "?([0-9a-f]{8})"?$/\1/p' | sort -u)
          [[ $want =~ ^[0-9a-f]{8}$ ]] || { echo "cannot read genesis label: '$want'"; exit 1; }
          for have in $(kubectl get sts -n iroha3 -l app.kubernetes.io/part-of=iroha3-rd \
                          -o jsonpath='{range .items[*]}{.metadata.labels.iroha3-rd/genesis}{"\n"}{end}'); do
            [[ $have == "$want" ]] || { echo "running genesis $have != $want: run scripts/wipe-network.sh first"; exit 1; }
          done
          kubectl get -n iroha3 -o name "configmap/genesis-$want" \
            secret/peer-bi secret/peer-bank-a secret/peer-bank-b secret/peer-bank-c
      - run: kubectl apply -k deploy/k8s
      - name: Wait for 4 Ready peers
        run: |
          # pods appear only after the StatefulSet controller acts; wait for all 4 to exist first
          for _ in $(seq 60); do
            [[ $(kubectl get pods -n iroha3 -l app.kubernetes.io/part-of=iroha3-rd -o name | wc -l) -eq 4 ]] && break
            sleep 5
          done
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/part-of=iroha3-rd -n iroha3 --timeout=15m
      - if: always()
        run: kubectl get pods,pvc -n iroha3 -o wide
