name: smoke
on: workflow_dispatch
concurrency: deploy # never overlap a deploy: smoke scales the bi StatefulSet
jobs:
  smoke:
    runs-on: [self-hosted, iroha3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get kubectl v1.33.13
        run: |
          base=https://dl.k8s.io/release/v1.33.13/bin/linux/amd64
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSLo kubectl "$base/kubectl"
          echo "$(curl -fsSL "$base/kubectl.sha256")  kubectl" | sha256sum -c -
          chmod +x kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: scripts/smoke.sh
      - if: always()
        run: kubectl get pods -n iroha3 -o wide
