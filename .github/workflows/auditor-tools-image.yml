name: auditor-tools-image
# The pinned tools image of the auditor client-key Jobs (deploy/auditor-sign keygen / put) must hold the three tools the Job scripts use: openssl, kubectl (>= 1.31: `patch --patch-file`)
# and base64 -w0. Public image, no secrets, no cluster. Docker runs only here, never on the operator host.
on:
  pull_request:
    paths: ['deploy/auditor-sign/**', '.github/workflows/auditor-tools-image.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  TOOLS_IMAGE: docker.io/alpine/k8s@sha256:dea899fe8ac3fa25bcf8a9c7e1dee4caad82ef18e84922a3b159dedc9cabee9f # alpine/k8s 1.34.13
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "pull the pinned tools image"
        run: docker pull -q "$TOOLS_IMAGE" >/dev/null
      - name: "openssl, kubectl --patch-file, base64 -w0, go-template, run as uid 1001 with a read-only root"
        run: |
          docker run --rm --user 1001:1001 --read-only --tmpfs /tmp --entrypoint sh "$TOOLS_IMAGE" -c '
            set -eu
            openssl version
            kubectl version --client
            kubectl patch --help | grep -q -- "--patch-file"
            printf x | base64 -w0 >/dev/null
            openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout /tmp/k -out /tmp/c -subj "/CN=t" 2>/dev/null
            openssl req -in /tmp/c -noout -verify
            echo "tools ok"'
