name: auditor-tools-image
# The two pinned images of the auditor client-key Jobs (deploy/auditor-sign keygen / put): the TOOLS image must hold kubectl (>= 1.31: `patch --patch-file`) and base64 -w0 (it has no openssl);
# the DRIVER image (initContainer) must hold openssl and a POSIX sh, and run as uid 1001 with a read-only root. Public image, no secrets, no cluster. Docker runs only here, never on the operator host.
on:
  pull_request:
    paths: ['deploy/auditor-sign/**', '.github/workflows/auditor-tools-image.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  TOOLS_IMAGE: docker.io/alpine/k8s@sha256:dea899fe8ac3fa25bcf8a9c7e1dee4caad82ef18e84922a3b159dedc9cabee9f # alpine/k8s 1.34.13
  DRIVER_IMAGE: ghcr.io/radityaaa43/iroha3-rd-driver@sha256:651435274da26c1fa3b9b010919ae5f76c8b86d21ea6ab8899c0fa7df2d98484 # D5
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "tools image gate: anonymous pull of the digest + key scan of its filesystem"
        run: |
          docker logout >/dev/null 2>&1 || true
          docker pull -q "$TOOLS_IMAGE" >/dev/null
          docker inspect --format '{{index .RepoDigests 0}}' "$TOOLS_IMAGE"
          id=$(docker create "$TOOLS_IMAGE")
          docker export "$id" > "$RUNNER_TEMP/fs.tar"
          docker rm "$id" >/dev/null
          python3 - "$RUNNER_TEMP/fs.tar" <<'PY'
          import re, sys, tarfile
          pat = re.compile(rb"-----BEGIN (?:[A-Z]+ )*PRIVATE KEY-----")
          hits = []
          with tarfile.open(sys.argv[1]) as t:
              for m in t:
                  if m.isfile() and m.size < 8 * 1024 * 1024:
                      if pat.search(t.extractfile(m).read()):
                          hits.append(m.name)
          print("files scanned; private-key hits:", hits)
          sys.exit(1 if hits else 0)
          PY
      - name: "tools image: kubectl --patch-file and base64 -w0, uid 1001, read-only root"
        run: |
          docker pull -q "$TOOLS_IMAGE" >/dev/null
          docker run --rm --user 1001:1001 --read-only --tmpfs /tmp --entrypoint sh "$TOOLS_IMAGE" -c '
            set -eu
            kubectl version --client
            kubectl patch --help | grep -q -- "--patch-file"
            printf x | base64 -w0 >/dev/null
            echo "tools ok"'
      - name: "driver image (initContainer): openssl makes a P-256 key and a CSR, uid 1001, read-only root"
        run: |
          docker pull -q "$DRIVER_IMAGE" >/dev/null
          docker run --rm --user 1001:1001 --read-only --tmpfs /work --entrypoint /bin/sh "$DRIVER_IMAGE" -c '
            set -eu
            umask 077
            openssl version
            openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -keyout /work/k -out /work/c -subj "/CN=t" 2>/dev/null
            openssl req -in /work/c -noout -verify
            echo "openssl ok"'
