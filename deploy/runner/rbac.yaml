apiVersion: v1
kind: ServiceAccount
metadata:
  name: gha-runner
  namespace: iroha3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gha-deployer
  namespace: iroha3
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: [statefulsets, services, configmaps, persistentvolumeclaims, networkpolicies, jobs, deployments, pods, pods/log]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gha-deployer
  namespace: iroha3
subjects:
  - kind: ServiceAccount
    name: gha-runner
    namespace: iroha3
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gha-deployer
