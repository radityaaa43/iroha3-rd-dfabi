apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gha-runner
  namespace: iroha3
spec:
  serviceName: gha-runner
  replicas: 1
  selector:
    matchLabels:
      app: gha-runner
  template:
    metadata:
      labels:
        app: gha-runner
    spec:
      serviceAccountName: gha-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.338.1
          workingDir: /home/runner
          command: ["/bin/bash", "-ec"]
          args:
            - |
              if [ ! -f /state/.runner ]; then
                ./config.sh --unattended --url https://github.com/radityaaa43/iroha3-rd-dfabi \
                  --token "$RUNNER_TOKEN" --name iroha3-incluster --labels iroha3 --replace
                cp -a .runner .credentials .credentials_rsaparams /state/
              else
                cp -a /state/.runner /state/.credentials /state/.credentials_rsaparams .
              fi
              exec ./run.sh
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gha-runner-registration
                  key: RUNNER_TOKEN
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: runner-state
              mountPath: /state
  volumeClaimTemplates:
    - metadata:
        name: runner-state
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: alicloud-essd-wffc
        resources:
          requests:
            storage: 1Gi
