apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iroha3
resources:
  - parties/bi
  - parties/bank-a
  - parties/bank-b
  - parties/bank-c
  - networkpolicy.yaml
# Genesis hash8 = first 8 chars after `hash:` in network/public/genesis.expected_hash, lowercase.
# Changing it requires scripts/wipe-network.sh first (deploy.yml refuses otherwise).
labels:
  - pairs:
      iroha3-rd/genesis: "5eec7287"
    includeTemplates: true
# The genesis ConfigMap name (base: genesis-HASH) is derived from the label above, so a new
# genesis is ONE edit. deploy/secrets.sh refuses to run if this label != the genesis hash8.
replacements:
  - source:
      kind: StatefulSet
      name: bi
      fieldPath: spec.template.metadata.labels.iroha3-rd/genesis
    targets:
      - select:
          kind: StatefulSet
        fieldPaths:
          - spec.template.spec.volumes.[name=genesis].configMap.name
        options:
          delimiter: "-"
          index: 1
