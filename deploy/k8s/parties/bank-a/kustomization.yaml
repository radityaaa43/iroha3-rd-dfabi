apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      iroha3-rd/party: bank-a
    includeSelectors: true
    includeTemplates: true
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: peer
      spec:
        serviceName: bank-a
        template:
          spec:
            volumes:
              - name: config
                secret:
                  secretName: peer-bank-a
  - target:
      name: peer
    patch: |-
      - op: replace
        path: /metadata/name
        value: bank-a
