# Build workflow for the rd-dfabi APS helper. NOT active in this repo.
#
# This repository is private, and a private-repo hosted runner (2 vCPU / 7 GB) ran out of memory compiling
# the Iroha workspace (see iroha3-rd-node-build/.github/workflows/build-image.yml). So the helper is built in
# the PUBLIC build repo radityaaa43/iroha3-rd-node-build: mirror Cargo.toml, Cargo.lock, apps/rd-dfabi/
# and scripts/fetch-iroha.sh into its `driver/` directory (the helper holds no keys and no cluster data), and copy this file to
# .github/workflows/build-driver.yml there. Output is a workflow artifact, fetched on the Lensa host with
#   gh run download <run-id> -R radityaaa43/iroha3-rd-node-build -n rd-dfabi -D frontend/server/state/iroha3/bin
name: build-driver
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-driver
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest   # public repo: 4 vCPU / 16 GB
    timeout-minutes: 345
    env:
      TOOLCHAIN: 1.93.1      # upstream rust-toolchain.toml at 071e281e
      # iroha_core + zk-stark filled 16 GB with 3 jobs in the node build; two jobs is a guess for this smaller graph.
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk and add swap
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo swapoff -a || true
          if sudo fallocate -l 16G /swapfile.build && sudo chmod 600 /swapfile.build \
             && sudo mkswap /swapfile.build && sudo swapon /swapfile.build; then echo "swap ok"; else echo "::warning::swap setup failed"; fi
          free -g; df -h /
      - name: Fetch Iroha 071e281e (path dependency, no submodules; a cargo git dep fails on submodule iroha-docs)
        run: scripts/fetch-iroha.sh
      - name: Toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
      # Dependency compilation is the cost; a helper-only change then rebuilds in minutes instead of hours.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            driver/target
          key: driver-${{ env.TOOLCHAIN }}-${{ hashFiles('driver/Cargo.lock') }}
          restore-keys: driver-${{ env.TOOLCHAIN }}-
      - name: Contract tests (no iroha, seconds)
        run: cargo test --locked -p rd-dfabi
      - name: Build with APS
        run: |
          ( while sleep 120; do echo "::group::resources $(date -u +%H:%M)"; free -m | sed -n 2,3p; df -h / | tail -1; echo "::endgroup::"; done ) &
          cargo build --release --locked -p rd-dfabi --features aps
      - name: Smoke
        run: |
          ./target/release/rd-dfabi --help
          ./target/release/rd-dfabi schema | head -c 400
          sha256sum target/release/rd-dfabi
      - uses: actions/upload-artifact@v4
        with:
          name: rd-dfabi
          path: driver/target/release/rd-dfabi
          if-no-files-found: error
          retention-days: 30
